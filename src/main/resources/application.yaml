spring:
  application:
    name: lol-comp-analysis-assistant

  datasource:
    url: jdbc:postgresql://localhost:5433/lol_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  data:
    # Redis 暂时不启用（英雄静态数据直接回源数据库；推荐系统后续如需缓存再开启）
    elasticsearch:
      repositories:
        enabled: false

  elasticsearch:
    uris: http://localhost:9200


server:
  port: 8080

logging:
  level:
    root: INFO
    com.LOLCAA: INFO
    com.LOLCAA.mapper: WARN
    com.LOLCAA.service.ingest.SummonerPoolRefreshService: WARN
    com.LOLCAA.service.ingest.RiotApiClient: ERROR
    org.mybatis: WARN
    com.baomidou: WARN

riot:
  api:
    key: RGAPI-838e5255-8245-4652-88b3-7adeef4f1232
    region: asia
    platform: KR
    max-retries: 2
    rate-limit-per-second: 10
    rate-limit-per-two-minutes: 80
  ingest:
    enabled: true
    fixed-delay-ms: 60000
    ensure-index-on-startup: true
    index-name: lol_matches
    per-puuid-count: 8
    queue: 420
    match-type: ranked
    puuid-batch-limit: 20
    refresh-pool-before-ingest: true
    league-queue: RANKED_SOLO_5x5
    pool-target-size: 500
    pool-refresh-min-interval-ms: 1800000
