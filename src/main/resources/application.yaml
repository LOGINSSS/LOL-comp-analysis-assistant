spring:
  application:
    name: lol-comp-analysis-assistant

  datasource:
    url: jdbc:postgresql://localhost:5433/lol_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  data:
    # Redis 暂时不启用（英雄静态数据直接回源数据库；推荐系统后续如需缓存再开启）
    elasticsearch:
      repositories:
        enabled: false

  elasticsearch:
    uris: http://localhost:9200

  # 避免 Spring Data Elasticsearch 启动时根据实体自动创建/更新索引（我们会手动建 mapping）

server:
  port: 8080

logging:
  level:
    root: INFO
    com.LOLCAA: DEBUG